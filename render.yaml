services:
  - type: web
    name: terminko
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node start.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NOTIFY_MODE
        value: stub
